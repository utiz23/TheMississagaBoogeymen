version: nhl26
family: x_factor_tiers
# X-Factor activation tiers (Elite, All Star, Specialist).
# Visually distinct UI labels with good OCR baseline; minimal aliases needed.
# Note: [x] notation flags OCR-error-prone characters; [l1] / [sS5] add digit confusion.

entries:
  - canonical: "Elite"
    aliases:
      - "(?i)^elite$"
      - "(?i)^elit[e]$"
      - "(?i)^e[l1]ite$"

  - canonical: "All Star"
    aliases:
      - "(?i)^all[\\s_]?star$"
      - "(?i)^allstar$"
      - "(?i)^all[\\s_]?sta[r]$"

  - canonical: "Specialist"
    aliases:
      - "(?i)^specialist$"
      - "(?i)^specia[l]ist$"
      - "(?i)^specialist[s]?$"
      - "(?i)^[sS5]pecialist$"
