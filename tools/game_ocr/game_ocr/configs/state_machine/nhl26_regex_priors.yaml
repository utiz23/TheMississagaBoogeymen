# Phase-A regex priors for the v2 screen classifier (NHL 26).
#
# Wired into the feature pipeline by S3 (`compute_frame_features_v2` in
# frame_features.py). Until that lands, this file is informational only — the
# v1 path doesn't load it. The skeleton below documents the minimum regexes
# Phase A needs to distinguish:
#
#   - Real pre-game lobby (both team panels visible) from the CLUB management
#     screen (single team panel, no opponent).
#   - The PLAYER LOADOUTS hub from the loadout-detail screen with its
#     HOME/AWAY left-strip.
#   - The WORLD OF CHEL splash from generic loading screens.
#
# Each regex runs against OCR text from one of two ROIs:
#   - `top_bar`: top ~200px of the frame (default, current anchor ROI).
#   - `side_strip`: left ~200px-wide strip, y=200..1080 (new in v2 to read
#     the HOME/AWAY column on the loadout-detail screen).
#
# When a regex matches, a per-class flag bit lands in the feature vector at
# the position assigned by the YAML order below. Coefficients are learned by
# train_screen_classifier.py — the regex flags are inputs, not hard rules.

version: "v0.1"
roi_definitions:
  top_bar:
    description: "Top header band; same as the current anchor ROI."
    bbox: [0, 0, 1920, 200]   # [x, y, w, h] in 1920x1080 native coords
  side_strip:
    description: "Left vertical strip containing the HOME/AWAY column on loadout-detail."
    bbox: [0, 200, 220, 880]

# ─── Phase-A new classes (must-win for the proving bench) ─────────────────────

menu_club_management:
  # The CLUB screen shows "THE <TEAM NAME>" header + a single roster column
  # with no opponent panel. The "CLUBS" tab in the navbar is the strongest
  # disambiguator from a real pre-game lobby (which is on the "PLAY" tab).
  - { name: club_word, pattern: '\bclub\b', roi: top_bar }
  - { name: manage_lineups, pattern: '\bmanage\s+(lineups|roster)\b', roi: top_bar }
  - { name: clubs_tab, pattern: '\bclubs\b', roi: top_bar }

player_loadout_landing:
  # The PLAYER LOADOUTS hub: grid of loadout cards, no HOME/AWAY strip yet.
  - { name: title, pattern: '\bplayer\s+loadouts?\b', roi: top_bar }
  - { name: select_hint, pattern: '\bselect\s+a\s+loadout\b' }

menu_world_of_chel:
  # The splash with the "WORLD OF CHEL" title text + silhouette. Anchor is
  # the title text — present on every frame of the splash.
  - { name: title, pattern: '\bworld\s+of\s+chel\b', roi: top_bar }

# ─── Classes Phase-A tightens (existing states that bleed into wrong frames) ──

# The "loadout-detail" screen now produces only `player_loadout_view` evidence;
# the landing screen above produces `player_loadout_landing`. The
# HOME/AWAY side strip is the unique signature of the detail view.
player_loadout_view:
  - { name: home_strip, pattern: '\bhome\b', roi: side_strip }
  - { name: away_strip, pattern: '\baway\b', roi: side_strip }

# Real pre-game lobby has the EASHL header AND a matchmaking countdown phrase.
# The CLUB screen and PLAYER LOADOUTS landing both have "eashl" in the navbar,
# so we need a stronger disambiguator — the countdown / "ready up" cue.
pre_game_lobby_state_2:
  - { name: eashl_title, pattern: '\beashl\b', roi: top_bar }
  - { name: ready_up, pattern: '\bready\s*up\b' }
  - { name: matchmaking, pattern: '\bmatchmaking\b' }

loading_or_intro:
  # Generic loading screens between the menu and gameplay. The "WORLD OF CHEL"
  # text is now claimed by menu_world_of_chel; loading_or_intro keeps the
  # generic "now loading"-style cues.
  - { name: now_loading, pattern: '\bnow\s+loading\b' }
  - { name: loading, pattern: '\bloading\b' }

# ─── Post-game screens (WS6: restored from the v1 state-machine anchor_substrings) ──
# The v1→v2 migration moved anchors from state-machine `anchor_substrings` into
# this file but never carried the post-game entries over, so post-game screens
# had NO text signal in v2 and collapsed to unknown_or_transition (see
# docs/ocr/ws6-postgame-classifier-diagnosis.md). These mirror the stable top-bar
# headers the OCR reads on every frame of each screen. Patterns use `\s*` so they
# survive OCR word-concatenation ("allevents", "goalsummary", "netchart").
# Priors are SOFT inputs (coefficients learned by train_screen_classifier.py) — the
# retrain disambiguates the deliberate overlaps (faceoff vs faceoff-summary;
# all-events vs all). Word boundaries keep `\ball\b` from firing inside "allevents".

post_game_action_tracker:
  - { name: all_events, pattern: '\ball\s*events\b', roi: top_bar }

post_game_events:
  # Scoring-summary "ALL" filter; bare "all" — `\b` prevents firing inside "allevents".
  - { name: all_filter, pattern: '\ball\b', roi: top_bar }

post_game_box_score_goals:
  - { name: goal_summary, pattern: '\bgoals?\s*summary\b', roi: top_bar }

post_game_box_score_shots:
  - { name: shot_summary, pattern: '\bshots?\s*summary\b', roi: top_bar }

post_game_box_score_faceoffs:
  - { name: faceoff_summary, pattern: '\bface\s*-?\s*off\s*summary\b', roi: top_bar }

post_game_net_chart:
  - { name: net_chart, pattern: '\bnet\s*chart\b', roi: top_bar }

post_game_faceoff_map:
  # The faceoff event-map header is "FACEOFF" (no "summary"). Also matches
  # "faceoff summary"; the box_score_faceoffs prior fires there too and the
  # retrained classifier separates the two on visual features.
  - { name: faceoff_map, pattern: '\bface\s*-?\s*off\b', roi: top_bar }

post_game_player_summary:
  # The PLAYER SUMMARY tab = per-player gamertag/stat table (see the canonical
  # ScreenShots fixture). NOT the "END OF GAME" team-aggregate tab, which is a
  # distinct screen with no dedicated state (it stays unknown_or_transition).
  - { name: player_summary, pattern: '\bplayer\s*summary\b', roi: top_bar }

unknown_or_transition:
  # Catch-all reject anchors: text that appears on transitional / OOD screens
  # and should *prevent* the classifier from leaking into a real screen class.
  - { name: customize, pattern: '\bcustomize\b' }
  - { name: season_pass, pattern: '\bseason\s*pass\b' }
  - { name: rewards, pattern: '\brewards\b' }
  - { name: waiting_for, pattern: '\bwaiting\s+for\b' }
  # Post-game / season-end leaderboard ("SEASON N ELITE CUP CHAMPIONS …").
  # The leaderboard is OOD — we route it to unknown_or_transition rather than
  # letting the classifier leak into loading_or_intro. The regex omits the
  # trailing word boundary because OCR runs "elite cup champions" together as
  # "elitecupcha…" in side_strip output (see S5.5 diagnostic on match-250).
  - { name: leaderboard_cup, pattern: '\belite\s*cup', roi: side_strip }
