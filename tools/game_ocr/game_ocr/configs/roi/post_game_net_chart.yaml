screen_type: post_game_net_chart
expected_width: 1920
expected_height: 1080
regions:
  net_chart_label:
    x: 0.020
    y: 0.140
    width: 0.130
    height: 0.060
    preprocess: threshold
  period_label:
    x: 0.150
    y: 0.140
    width: 0.180
    height: 0.060
    preprocess: threshold
  away_label:
    x: 0.040
    y: 0.205
    width: 0.100
    height: 0.045
    preprocess: invert-threshold
  home_label:
    x: 0.310
    y: 0.205
    width: 0.090
    height: 0.045
    preprocess: invert-threshold
  stats_panel:
    x: 0.020
    y: 0.255
    width: 0.400
    height: 0.420
    preprocess: invert-threshold
  # Game-level shot totals from the centered score-strip header, immediately
  # below the team names. These are identical across all per-period frames in
  # a match (e.g. "29 SHOTS" / "16 SHOTS"), so the promoter uses them to
  # populate the ALL PERIODS (period_number=-1) aggregate row even when no
  # dedicated ALL PERIODS frame was captured. Calibrated against the four
  # canonical match-250 captures in
  # research/OCR-SS/Action-Tracker/Net-Chart/.
  header_total_shots_away:
    x: 0.520
    y: 0.220
    width: 0.070
    height: 0.040
    preprocess: invert-threshold
  header_total_shots_home:
    x: 0.775
    y: 0.220
    width: 0.070
    height: 0.040
    preprocess: invert-threshold
  # Per-cell sub-ROIs (Issue C, Pass B). Each cell is isolated so RapidOCR's
  # digit classifier sees only one numeric glyph at a time, disambiguating
  # the 6↔9 confusion the panel-block reading can't text-recover. The 14
  # ROIs (7 shot types × {away, home}) were calibrated against the 1st-period
  # canonical capture vlcsnap-2026-05-10-02h07m08s705.png — row spacing 0.046
  # normalized, away column centered at x≈0.075, home column at x≈0.340.
  # Width is generous (0.050) so 2-digit ALL PERIODS totals fit.
  stats_total_shots_away:
    x: 0.050
    y: 0.270
    width: 0.050
    height: 0.040
    preprocess: invert-threshold
  stats_total_shots_home:
    x: 0.315
    y: 0.270
    width: 0.050
    height: 0.040
    preprocess: invert-threshold
