screen_type: post_game_faceoff_map
expected_width: 1920
expected_height: 1080
regions:
  faceoff_label:
    x: 0.020
    y: 0.140
    width: 0.130
    height: 0.060
    preprocess: threshold
  period_label:
    x: 0.150
    y: 0.140
    width: 0.180
    height: 0.060
    preprocess: threshold
  away_label:
    x: 0.040
    y: 0.205
    width: 0.100
    height: 0.045
    preprocess: invert-threshold
  home_label:
    x: 0.310
    y: 0.205
    width: 0.090
    height: 0.045
    preprocess: invert-threshold
  stats_panel:
    x: 0.020
    y: 0.255
    width: 0.400
    height: 0.260
    preprocess: invert-threshold
  # Nine face-off dot ROI PAIRS on the rink diagram (right half of the screen).
  # Each dot generates two regions with identical x/y/width/height but different
  # preprocessing: `flag-away` isolates the red flag chip (away wins) via HSV
  # color masking; `flag-home` isolates the dark flag chip via the red anchor's
  # right-mirror. dot_id positions are absolute (independent of attacking
  # direction): lz_ / rz_ = left/right end-zone; lnz_ / rnz_ = left/right
  # neutral-zone; center = center-ice; _top / _bot = top/bottom of the rink.
  dot_lz_top_away:
    x: 0.465
    y: 0.360
    width: 0.110
    height: 0.090
    preprocess: flag-away
  dot_lz_top_home:
    x: 0.465
    y: 0.360
    width: 0.110
    height: 0.090
    preprocess: flag-home
  dot_lz_bot_away:
    x: 0.465
    y: 0.545
    width: 0.110
    height: 0.090
    preprocess: flag-away
  dot_lz_bot_home:
    x: 0.465
    y: 0.545
    width: 0.110
    height: 0.090
    preprocess: flag-home
