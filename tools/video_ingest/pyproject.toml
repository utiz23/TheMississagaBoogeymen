[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-ingest"
version = "0.1.0"
description = "Two-pass video → OCR frames orchestrator for NHL post-game ingestion"
requires-python = ">=3.11"
dependencies = [
  "opencv-python",
  "numpy",
  "PyYAML",
  "typer",
  "scikit-learn>=1.3",
  # PyAV: pinned to a 13.x line. Pass-1 uses it for canonical container
  # PTS per decoded frame; libav bumps occasionally break the wheel ABI,
  # so pin tight and bump deliberately when the source ffmpeg changes.
  "av>=13.0,<14",
  # game_ocr is sourced via PYTHONPATH; not pinned here to keep the
  # tools/ dirs decoupled.
]

[project.scripts]
video-ingest = "video_ingest.cli:app"

[tool.setuptools]
packages = ["video_ingest"]

[tool.setuptools.package-data]
video_ingest = ["configs/*.yaml"]
