# nhl26.yaml — per-version orchestrator config.
#
# pass1.sample_fps: rate at which the segmenter samples the video for
# classification. 1 fps is enough — most screens are stable for at
# least 3-5 seconds and the N-consecutive-frame window logic merges
# short same-type runs into segments.
#
# pass2.sample_rates: dense extraction fps per screen type, picked so
# OCR latency at panel-crop (≈336 ms p50 on RTX 3060) keeps Pass-2 in
# proportion with Pass-1. Action-tracker is the heaviest segment;
# everything else is static or near-static so 1 fps is plenty.
#
# pass2.window_padding_seconds: extra seconds either side of a Pass-1
# segment to extract, to defend against off-by-one boundary errors in
# the coarse 1-fps classification.

version: "nhl26"

pass1:
  sample_fps: 1
  # N consecutive same-type frames required to OPEN a segment. Bumped from 3
  # to 2 on 2026-05-18: at 1 fps a brief faceoff-map view (visible for only
  # 2 frames) was getting rejected; 2 still kills single-frame classifier
  # hiccups via the max_outliers_within=1 reset rule below.
  min_run_to_open: 2
  # Tolerate K frames inside a segment whose label disagrees; resets
  # the run only after K+1 in a row.
  max_outliers_within: 1
  # Minimum segment duration (in source-video seconds) to emit. Drops
  # micro-segments that are almost certainly classifier hiccups.
  min_segment_seconds: 3
  # Phase 1 engine. As of S5 (2026-05-27):
  #   "viterbi_v2" (default) — v2 LR head + regex priors + both-ROI OCR;
  #     reads weights/nhl26-screen-classifier-v2.json and nhl26.yaml state machine.
  #   "viterbi"               — v1 single-anchor LR head; reads
  #     weights/nhl26-screen-classifier-v1.json and nhl26-v1.yaml state machine.
  #   "run_length"            — legacy fallback (phase 5 deletes it).
  engine: viterbi_v2
  # Per-screen overrides for screens the user briefly tabs through in the
  # post-game flow. Loosened from the strict 3-second default so a 1-2 second
  # post-game view still emits as a segment. The remaining screens
  # (post_game_action_tracker, pre_game_lobby_state_2, post_game_player_summary,
  # post_game_events) are dwelled-on for several seconds in normal play, so
  # they keep the strict global thresholds to defend against classifier flicker
  # during mid-gameplay frames.
  min_segment_seconds_by_screen:
    player_loadout_view: 1.0
    post_game_box_score_goals: 1.0
    post_game_faceoff_map: 1.0
    post_game_net_chart: 1.0
  min_run_to_open_by_screen:
    player_loadout_view: 1
    post_game_box_score_goals: 1
    post_game_faceoff_map: 1
    post_game_net_chart: 1
  # WS2 pre-OCR gate: skip the expensive per-frame OCR on frames that are
  # UNAMBIGUOUSLY non-text (black / fade / loading), then pin them to
  # unknown_or_transition. Conservative: a frame is gated only when ALL
  # configured criteria agree (require_all). Thresholds are upper bounds — a
  # frame qualifies as non-text when its signal is <= the bound.
  #   max_edge_density — primary discriminator: text/UI chrome produces many
  #     Canny edges; a flat fade has ~none (and the AND on it protects in-game
  #     gameplay, whose clock overlay carries edges).
  #   max_log_blur — log1p(Laplacian variance); sharp text is high, a flat
  #     frame is near-zero.
  #   max_brightness — strong fade/blackout co-signal.
  # Launch values gate a black-frame signature only (smallest safe win).
  # Widen max_edge_density against the proving bench to recover more.
  # ABSENT block ⇒ gate disabled. Env kill switch: OCR_PASS1_GATE_ENABLED=false.
  pre_ocr_gate:
    enabled: true
    require_all: true
    max_brightness: 0.06
    max_edge_density: 0.005
    max_log_blur: 2.0

pass2:
  window_padding_seconds: 1.0
  # loadout_engine: selects the player_loadout_view extraction path.
  # 'legacy' = existing parse_loadout_result() pass-through (default through Phase 2A).
  # 'typed_v1' = new extract_loadout_evidence() → loadout_evidence.json (Task 2B-9 flipped default).
  loadout_engine: typed_v1
  # lobby_engine: selects the pre_game_lobby_state_2 extraction path.
  # 'legacy' = existing parse_pre_game_result() pass-through.
  # 'typed_v1' = extract_lobby_evidence() → lobby_evidence.json (Task 3B-8 cutover).
  # pre_game_lobby_state_1 always uses the legacy path — Phase 3a confirmed
  # no state_1 frames in operator recordings (see docs/calibration/
  # phase-3a-hmm-disambiguation-2026-05-22.md).
  lobby_engine: typed_v1
  sample_rates:
    post_game_action_tracker: 5
    post_game_player_summary: 1
    post_game_box_score_goals: 1
    post_game_box_score_shots: 1
    post_game_box_score_faceoffs: 1
    post_game_events: 1
    post_game_faceoff_map: 1
    post_game_net_chart: 1
    pre_game_lobby_state_2: 1
    # 3 fps for loadout: at 1 fps the operator's per-subject window
    # (~1.5s) was straddling sample boundaries, causing missed subjects
    # (Joey RD in match 250, Thick Ooze RD in match 463).  3 fps gives
    # 4-5 samples per subject window — guarantees ≥1 stable mid-window
    # frame.  See docs/calibration/phase-2b-parallel-diff-2026-05-21.md.
    player_loadout_view: 3

# Visual Prefilter Phase 3 — per-segment Pass-2 frame selection.
# Default `pass2_enabled: false` so this YAML ships byte-for-byte
# compatible with pre-Phase-3 behaviour. Flip to true (or pass
# `--prefilter` on the CLI) to opt in. Each segment whose screen_type
# is keyed in `pass2.frame_budget` runs `compute_visual_signals` +
# `select_frames`: near-duplicate frames are dropped via dHash and the
# survivor count is uniformly downsampled to the per-screen budget.
# Screens absent from `frame_budget` are untouched (no filtering).
# Switching the effective state (CLI > YAML) invalidates the pass2
# cache via the prefilter fingerprint in `compute_pass2_cache_key`.
visual_prefilter:
  pass2_enabled: false
  pass2:
    # Starter caps — conservative; tune during enabled-mode verification.
    # Action-tracker keeps the largest budget because it's the densest
    # (5 fps) screen and carries the most per-frame event-map detail.
    frame_budget:
      post_game_action_tracker: 8
      post_game_box_score_goals: 2
      post_game_box_score_shots: 2
      post_game_box_score_faceoffs: 2
      post_game_events: 4
      post_game_faceoff_map: 3
      post_game_net_chart: 3
      post_game_player_summary: 3
      pre_game_lobby_state_2: 4
      player_loadout_view: 6
    # dedup_dhash_distance: per-screen Hamming-distance threshold for
    # the dHash near-duplicate check. Absent screens default to 8.
    dedup_dhash_distance: {}

# Screen types we DO extract in Pass-2. Anything else (unknown_screen,
# pre_game_lobby_state_1, in_game_*, etc.) is logged + skipped.
# Phase 1: post_game_box_score_{shots,faceoffs} added now that the HMM
# decoder can distinguish them from the goals tab (state machine YAML +
# trained weights cover all three tabs). Worker-side walkers and promoter
# maps already handle these screen types.
extract_screens:
  - post_game_action_tracker
  - post_game_player_summary
  - post_game_box_score_goals
  - post_game_box_score_shots
  - post_game_box_score_faceoffs
  - post_game_events
  - post_game_faceoff_map
  - post_game_net_chart
  - pre_game_lobby_state_2
  - player_loadout_view
